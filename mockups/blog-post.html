<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FanHearth — Blog Post</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="blog-post" data-show-more>

<div data-include="partials/sidebar.html"></div>

<div class="main-area">
  <div data-include="partials/header.html"></div>

  <div class="content">

    <div class="profile-header">
      <div class="profile-avatar-col">
        <div class="profile-avatar">
          <svg viewBox="0 0 54 54"><circle cx="27" cy="20" r="10" fill="#fff" opacity="0.85"/><path d="M6 50 Q27 36 48 50" fill="#fff" opacity="0.85"/></svg>
        </div>
        <a class="short-form-link" href="short-form.html">Short Form<br>Posts</a>
      </div>
      <div class="profile-banner">Custom Banner for Blog</div>
    </div>

    <div class="blog-post-title-bar">
      <div class="blog-thumb">
        <svg viewBox="0 0 44 44" fill="none">
          <rect x="2" y="6" width="40" height="30" rx="3" stroke="white" stroke-width="2.5"/>
          <circle cx="14" cy="17" r="4" fill="white"/>
          <path d="M2 28 L14 18 L22 24 L30 16 L42 28" stroke="white" stroke-width="2.5" fill="none"/>
        </svg>
      </div>
      <div class="blog-post-title-text">Blog Title</div>
    </div>

    <div class="blog-body-area">
      <div class="blog-text-col">
        <div class="drop-cap">A</div>
        <div class="text-line" style="width:72%;"></div>
        <div class="text-line" style="width:91%;"></div>
        <div class="text-line" style="width:86%;"></div>
        <div style="clear:both;"></div>
        <div class="text-line" style="width:95%;"></div>
        <div class="text-line" style="width:78%;"></div>
        <div class="text-line" style="width:88%;"></div>
        <div class="text-line" style="width:65%;"></div>
        <div class="text-line" style="width:93%;"></div>
        <div class="text-line" style="width:80%;"></div>
      </div>
      <div class="blog-image-col">
        <div class="blog-image-box">
          <svg viewBox="0 0 80 80" fill="none">
            <rect x="4" y="12" width="72" height="56" rx="4" stroke="white" stroke-width="3"/>
            <circle cx="24" cy="32" r="8" fill="white"/>
            <path d="M4 54 L22 36 L40 50 L54 38 L76 56" stroke="white" stroke-width="3" fill="none"/>
          </svg>
        </div>
        <div class="image-caption">Optional Caption</div>
      </div>
    </div>

  </div>
</div>

<script src="includes.js"></script>
</body>
</html>
